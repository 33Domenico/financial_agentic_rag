[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pypdf",
    "cryptography",
    "qdrant-client",
    "sentence-transformers",
    "python-dotenv",
    "langchain-openai",
    "langsmith",
    "openevals",
]

[tool.setuptools.packages.find]
where = ["src"]
